# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "hello"
  test:
    cmds:
      - gorgeous
      - go vet ./...
      - staticcheck ./...
      - go test -race -count=1 ./...
      - cd cmd/example/db && go test -race -count=1 ./...
  trs:
    env:
      anygo-ut-redis: redis://127.0.0.1:6379
    cmds:
      - go test -race  github.com/xanygo/anygo/store/xredis
  trc:
    cmds:
      - go test -race  github.com/xanygo/anygo/store/xredis
