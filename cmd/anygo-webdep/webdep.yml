
version: 1

# 构建输出配置
output:
  # cdn   - 只生成 CDN 资源注册代码，不下载资源
  # embed - 下载资源，生成 Go Embed 和 HTTP Handler
  mode: embed

  # 生成文件的输出目录
  dir: output/

  # 生成 Go 文件的包名
  package: webassets

  # Embed 模式下 HTTP Handler 配置
  handler:
    # 资源访问 URL 前缀
    prefix: /asset/

    # 生成的 Handler 函数名称
    name: Handler


# 资源来源配置
sources:

  # 2. 单个网络文件
  # 不需要下载时，直接使用 CDN 地址
  # Embed 模式下根据 URL 下载文件
  - name: htmx
    files:
      - name: htmx.min.js
        url: https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js
        integrity: "sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"

  # 3. 多文件网络资源包
  # 每个文件可以独立指定 CDN 地址
  - name: bootstrap
    files:
      - name: bootstrap.min.js
        url: https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js
        archive_path: js/bootstrap.bundle.min.js
        integrity: "sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"

      - name: bootstrap.min.css
        url: https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css
        archive_path: css/bootstrap.min.css

    # ZIP 下载及文件提取配置
    archive:
      type: zip
      url: https://github.com/twbs/bootstrap/releases/download/v5.3.9/bootstrap-5.3.9-dist.zip
      filename: bootstrap.zip

      # ZIP 文件 SHA256 校验值，可选
      hash: "sha256:13f7bb777406d87cfd4f34cf285aa586db085db526e1669594d0954c4b119259"

      strip_components: 1

  # 4. jQuery资源包示例
  - name: jquery
    files:
      - name: jquery.min.js
        url: https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js



# 最终注册的 Web 资源
assets:

  # Bootstrap CSS
  - name: bootstrap-css
    type: css
    source: bootstrap
    file: bootstrap.min.css

  # Bootstrap JS
  - name: bootstrap-js
    type: js
    source: bootstrap
    file: bootstrap.min.js
    attrs:
      defer:
    depends_on:
      - bootstrap-css

  # HTMX
  - name: htmx
    type: js
    source: htmx
    file: htmx.min.js
    attrs:
      defer: 

  # jQuery
  - name: jquery
    type: js
    source: jquery
    file: jquery.min.js
    attrs:
      defer: 

  # 纯 CDN 资源
  # 不下载、不 Embed
  - name: my-jquery
    type: js
    url: https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js
    attrs:
      defer: 
